# Runs infratructure/cloudflare/terraform/deploy.sh for dev with the secrets of the GitHub
# environment `dev`. Pull requests from this repository get a plan in the job summary; a push to
# main (or a manual run on main) plans and applies; a manual run elsewhere only plans. Forks get no
# secrets, so their PRs are skipped.
name: CD

on:
  push:
    branches: [main]
    paths: ['infratructure/cloudflare/**', '.github/workflows/cd.yml']
  pull_request:
    paths: ['infratructure/cloudflare/**', '.github/workflows/cd.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    # Same-repository PRs, or a manual run on another branch.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: cloudflare-dev-plan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9  # same as mise.toml
          tofu_wrapper: false
      - run: infratructure/cloudflare/terraform/deploy.sh dev plan
        env:  # only this step sees the secrets
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_EMAILS: ${{ secrets.CLOUDFLARE_ACCESS_EMAILS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    # One apply at a time, and a running apply is never cancelled.
    concurrency:
      group: cloudflare-dev-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9  # same as mise.toml
          tofu_wrapper: false
      - run: |
          infratructure/cloudflare/terraform/deploy.sh dev plan
          infratructure/cloudflare/terraform/deploy.sh dev apply
        env:  # only this step sees the secrets
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_EMAILS: ${{ secrets.CLOUDFLARE_ACCESS_EMAILS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
