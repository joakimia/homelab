# Runs `tests/check.sh` with CI=true (set by GitHub), which adds the Docker groups. No cluster,
# VM, or secrets. The weekly run on the default branch catches drift in upstream packages,
# images, and charts.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '0 5 * * 1'  # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso  # seed ISO cases
      - run: tests/check.sh
