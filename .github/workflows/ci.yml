# Runs `tests/check.sh` with CI=true (set by GitHub), which adds the Docker groups. No cluster,
# VM, or secrets. The weekly run on the default branch catches drift in upstream packages,
# images, and charts.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '0 5 * * 1'  # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9  # same as mise.toml
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v10.3.3
      # Same versions as mise.toml; ansible-core 2.22 needs Python 3.13.
      - run: |
          uv tool install --python 3.13 ansible-core==2.22.0
          uv tool install --python 3.13 --with ansible-core==2.22.0 ansible-lint==26.11.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso  # seed ISO cases
      - run: tests/check.sh
