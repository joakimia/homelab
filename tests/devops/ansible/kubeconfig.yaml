# A kubeconfig shaped like the Proxmox host's: the playbook only checks the homelab-server context.
apiVersion: v1
kind: Config
clusters:
  - name: homelab-server
    cluster:
      server: https://192.0.2.10:6443
contexts:
  - name: homelab-server
    context:
      cluster: homelab-server
      user: homelab-server
current-context: homelab-server
users:
  - name: homelab-server
    user:
      token: not-a-real-token
