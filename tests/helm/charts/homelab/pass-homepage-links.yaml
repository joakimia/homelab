# A profile overrides links by key and adds more: only enabled links are on the page.
# expect: <a href="https://longhorn.homelab.com:8443" class="svc" data-id="longhorn">
# expect: <span class="svc-title">Longhorn</span>
# expect: <a href="https://grafana.homelab.com:8443" class="svc" data-id="grafana">
# expect: <a href="https://example.homelab.com:8443/" class="svc" data-id="example">
# expect: <span class="svc-host mono">example.homelab.com</span>
homelab-frontend:
  links:
    longhorn:
      enabled: true
    traefik:
      enabled: false
    example:
      title: Example
      url: https://example.homelab.com:8443/
      enabled: true
