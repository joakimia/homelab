# Optional environment specific override values for the homelab RKE2 cluster goes here
# If no override values are needed, this file can be left empty.
# It must be defined however, if you want to deploy the chart in this environment.

# Shared files on Longhorn: ReadWriteMany, so pods on any node can mount the claim (Longhorn
# serves it over NFS from a share-manager pod in hlab-storage; nodes need nfs-common).
homelab-shared-pvc:
  enabled: true
  storageClassName: longhorn
  accessModes: [ReadWriteMany]

# The start page is public (no Cloudflare Access login); the other hosts need the Access login.
# Links to the UIs this profile installs, including Authentik, Longhorn, and the Traefik dashboard.
homelab-frontend:
  host: homepage.joakimia.dev
  # https://joakimia.dev/ shows the homepage too (the tunnel routes the bare domain to Traefik).
  extraHosts: [joakimia.dev]
  ingress:
    tls:
      clusterIssuer: letsencrypt
  links:
    auth:
      title: Authentik
      url: https://authentik.joakimia.dev
    grafana:
      url: https://grafana.joakimia.dev
    longhorn:
      url: https://longhorn.joakimia.dev
      enabled: true
    pgadmin:
      url: https://pgadmin.joakimia.dev
    prometheus:
      url: https://prometheus.joakimia.dev
    traefik:
      url: https://traefik.joakimia.dev
