# Environment overrides for this two-node RKE2 cluster.
longhorn:
  persistence:
    # Keep two copies of each Longhorn volume across cp0 and wk0.
    defaultClassReplicaCount: 2
  defaultSettings:
    defaultReplicaCount: 2

# Served as https://longhorn.joakimia.dev/ through the Cloudflare Tunnel, with a Let's Encrypt certificate.
host: longhorn.joakimia.dev
ingress:
  tls:
    clusterIssuer: letsencrypt
