{{- $_ := required "name is required" .Values.name -}}
{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "ports settings are required" .Values.ports -}}
{{- $_ := required "ports.metrics settings are required" .Values.ports.metrics -}}
{{- $_ := required "ports.metrics.containerPort is required" .Values.ports.metrics.containerPort -}}
{{- $_ := required "probes settings are required" .Values.probes -}}
{{- $_ := required "probes.startup settings are required" .Values.probes.startup -}}
{{- $_ := required "probes.readiness settings are required" .Values.probes.readiness -}}
{{- $_ := required "probes.liveness settings are required" .Values.probes.liveness -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # With more than one replica, prefer one connector per node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [tunnel, run]
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics.containerPort }}
          {{- with include "homelab.containerEnv" . | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "homelab.secretVolumeMounts" . | trim }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with include "homelab.secretVolumes" . | trim }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
