{{- $namespace := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $image := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" $image.repository -}}
{{- $_ := required "image.tag is required" $image.tag -}}
{{- $ports := required "ports settings are required" .Values.ports -}}
{{- $_ := required "ports.web.hostPort is required" $ports.web.hostPort -}}
{{- $_ := required "ports.websecure.hostPort is required" $ports.websecure.hostPort -}}
{{- $_ := required "ingressClass.name is required" .Values.ingressClass.name -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "traefik.fullname" . }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "traefik.fullname" . }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "traefik.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "traefik.fullname" . }}
    namespace: {{ .Values.namespace }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass.name }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
  {{- if .Values.ingressClass.isDefaultClass }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "traefik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traefik.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "traefik.fullname" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass={{ .Values.ingressClass.name }}
            - --providers.kubernetesingress.allowexternalnameservices=false
            - --entrypoints.web.address=:{{ .Values.ports.web.containerPort }}
            - --entrypoints.websecure.address=:{{ .Values.ports.websecure.containerPort }}
            - --entrypoints.traefik.address=:{{ .Values.ports.api.containerPort }}
            - --ping=true
            - --ping.entrypoint=traefik
            - --accesslog=true
            - --log.level=INFO
          ports:
            - name: web
              containerPort: {{ .Values.ports.web.containerPort }}
              hostPort: {{ .Values.ports.web.hostPort }}
              protocol: TCP
            - name: websecure
              containerPort: {{ .Values.ports.websecure.containerPort }}
              hostPort: {{ .Values.ports.websecure.hostPort }}
              protocol: TCP
            - name: traefik
              containerPort: {{ .Values.ports.api.containerPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "traefik.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
