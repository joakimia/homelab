{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "ports settings are required" .Values.ports -}}
{{- $_ := required "ports.web.containerPort is required" .Values.ports.web.containerPort -}}
{{- $_ := required "ports.websecure.containerPort is required" .Values.ports.websecure.containerPort -}}
{{- $_ := required "ports.traefik.containerPort is required" .Values.ports.traefik.containerPort -}}
{{- $_ := required "probes settings are required" .Values.probes -}}
{{- $_ := required "probes.startup settings are required" .Values.probes.startup -}}
{{- $_ := required "probes.startup.initialDelaySeconds is required" .Values.probes.startup.initialDelaySeconds -}}
{{- $_ := required "probes.startup.periodSeconds is required" .Values.probes.startup.periodSeconds -}}
{{- $_ := required "probes.startup.timeoutSeconds is required" .Values.probes.startup.timeoutSeconds -}}
{{- $_ := required "probes.startup.failureThreshold is required" .Values.probes.startup.failureThreshold -}}
{{- $_ := required "probes.readiness settings are required" .Values.probes.readiness -}}
{{- $_ := required "probes.readiness.initialDelaySeconds is required" .Values.probes.readiness.initialDelaySeconds -}}
{{- $_ := required "probes.readiness.periodSeconds is required" .Values.probes.readiness.periodSeconds -}}
{{- $_ := required "probes.readiness.timeoutSeconds is required" .Values.probes.readiness.timeoutSeconds -}}
{{- $_ := required "probes.readiness.failureThreshold is required" .Values.probes.readiness.failureThreshold -}}
{{- $_ := required "probes.liveness settings are required" .Values.probes.liveness -}}
{{- $_ := required "probes.liveness.initialDelaySeconds is required" .Values.probes.liveness.initialDelaySeconds -}}
{{- $_ := required "probes.liveness.periodSeconds is required" .Values.probes.liveness.periodSeconds -}}
{{- $_ := required "probes.liveness.timeoutSeconds is required" .Values.probes.liveness.timeoutSeconds -}}
{{- $_ := required "probes.liveness.failureThreshold is required" .Values.probes.liveness.failureThreshold -}}
{{- $_ := required "resources are required" .Values.resources -}}
{{- $_ := required "ingress settings are required" .Values.ingress -}}
{{- $_ := required "ingress.className is required" .Values.ingress.className -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "traefik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traefik.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "traefik.fullname" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass={{ .Values.ingress.className }}
            - --providers.kubernetesingress.allowexternalnameservices=false
            - --entrypoints.web.address=:{{ .Values.ports.web.containerPort }}
            - --entrypoints.websecure.address=:{{ .Values.ports.websecure.containerPort }}
            # TLS on websecure for every route; certificate from the Ingress spec.tls Secret.
            - --entrypoints.websecure.http.tls=true
            - --entrypoints.traefik.address=:{{ .Values.ports.traefik.containerPort }}
            - --ping=true
            - --ping.entrypoint=traefik
            - --accesslog=true
            - --log.level=INFO
          ports:
            - name: web
              containerPort: {{ .Values.ports.web.containerPort }}
              {{- with .Values.ports.web.hostPort }}
              hostPort: {{ . }}
              {{- end }}
              protocol: TCP
            - name: websecure
              containerPort: {{ .Values.ports.websecure.containerPort }}
              {{- with .Values.ports.websecure.hostPort }}
              hostPort: {{ . }}
              {{- end }}
              protocol: TCP
            - name: traefik
              containerPort: {{ .Values.ports.traefik.containerPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
