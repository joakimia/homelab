{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "ports settings are required" .Values.ports -}}
{{- $_ := required "ports.web.containerPort is required" .Values.ports.web.containerPort -}}
{{- $_ := required "ports.web.hostPort is required" .Values.ports.web.hostPort -}}
{{- $_ := required "ports.websecure.containerPort is required" .Values.ports.websecure.containerPort -}}
{{- $_ := required "ports.websecure.hostPort is required" .Values.ports.websecure.hostPort -}}
{{- $_ := required "ports.api.containerPort is required" .Values.ports.api.containerPort -}}
{{- $_ := required "ingressClass.name is required" .Values.ingressClass.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "traefik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traefik.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "traefik.fullname" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass={{ .Values.ingressClass.name }}
            - --providers.kubernetesingress.allowexternalnameservices=false
            - --entrypoints.web.address=:{{ .Values.ports.web.containerPort }}
            - --entrypoints.websecure.address=:{{ .Values.ports.websecure.containerPort }}
            - --entrypoints.traefik.address=:{{ .Values.ports.api.containerPort }}
            - --ping=true
            - --ping.entrypoint=traefik
            - --accesslog=true
            - --log.level=INFO
          ports:
            - name: web
              containerPort: {{ .Values.ports.web.containerPort }}
              hostPort: {{ .Values.ports.web.hostPort }}
              protocol: TCP
            - name: websecure
              containerPort: {{ .Values.ports.websecure.containerPort }}
              hostPort: {{ .Values.ports.websecure.hostPort }}
              protocol: TCP
            - name: traefik
              containerPort: {{ .Values.ports.api.containerPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
