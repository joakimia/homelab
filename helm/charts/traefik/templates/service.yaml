{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "service settings are required" .Values.service -}}
{{- $_ := required "service.type is required" .Values.service.type -}}
{{- $_ := required "service.ports settings are required" .Values.service.ports -}}
{{- $_ := required "service.ports.web is required" .Values.service.ports.web -}}
{{- $_ := required "service.ports.websecure is required" .Values.service.ports.websecure -}}
{{- $_ := required "dashboard settings are required" .Values.dashboard -}}
{{- if .Values.dashboard.enabled }}
{{- $_ := required "service.ports.traefik is required when dashboard.enabled is true" .Values.service.ports.traefik -}}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traefik.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "traefik.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: {{ .Values.service.ports.web }}
      targetPort: web
      protocol: TCP
    - name: websecure
      port: {{ .Values.service.ports.websecure }}
      targetPort: websecure
      protocol: TCP
    {{- if .Values.dashboard.enabled }}
    - name: traefik
      port: {{ .Values.service.ports.traefik }}
      targetPort: traefik
      protocol: TCP
    {{- end }}
