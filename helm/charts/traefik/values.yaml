namespace: hlab-networking

name: traefik

image:
  repository: traefik
  tag: v3.7.14
  pullPolicy: IfNotPresent

nameOverride: ""

# Unprivileged ports: HTTP on 8080 and HTTPS on 8443 on the node, the dashboard/ping
# entrypoint on 9000 inside the pod only.
ports:
  web:
    containerPort: 8080
    hostPort: 8080
  websecure:
    containerPort: 8443
    hostPort: 8443
  api:
    containerPort: 9000

ingress:
  className: traefik
  isDefaultClass: false

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}

nodeSelector: {}

tolerations:
  - operator: Exists
