namespace: hlab-networking

name: traefik

image:
  repository: traefik
  tag: v3.7.14
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

podSecurityContext: {}

probes:
  startup:
    httpGet:
      path: /ping
      port: traefik
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  readiness:
    httpGet:
      path: /ping
      port: traefik
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    httpGet:
      path: /ping
      port: traefik
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

ports:
  web:
    containerPort: 8080
    hostPort: 8080
  websecure:
    containerPort: 8443
    hostPort: 8443
  traefik:
    containerPort: 9000

service:
  type: ClusterIP
  ports:
    web: 8080
    websecure: 8443
    # Only with dashboard.enabled.
    traefik: 9000

ingress:
  className: traefik
  isDefaultClass: false

# ForwardAuth middleware authelia@file. An Ingress opts in with the annotation
# traefik.ingress.kubernetes.io/router.middlewares: authelia@file.
forwardAuth:
  enabled: true
  address: http://authelia.hlab-platform.svc.cluster.local:9091/api/authz/forward-auth
  authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]

# Prometheus metrics (requests, durations, status codes per entrypoint, router, and service) at
# :9000/metrics on the traefik entrypoint. The pod annotations let Prometheus find it.
metrics:
  enabled: true

# One trace per request, sent over OTLP gRPC to Alloy, which forwards it to Tempo.
tracing:
  enabled: true
  endpoint: alloy.hlab-observability.svc.cluster.local:4317
  # Share of requests traced, 0 to 1.
  sampleRate: 1

# Read-only view of Traefik's routers, services, and middlewares at https://<host>:8443/.
# It is served on the traefik entrypoint (9000, inside the cluster only) and published by this
# chart's own Ingress through the Service; / redirects to /dashboard/.
dashboard:
  enabled: true
  host: traefik.homelab.com
  # Certificate for host from cert-manager (needs the cert-manager and cert-issuers charts).
  tls:
    enabled: true
    clusterIssuer: homelab-ca
  # Login through Authelia; the route is then HTTPS only. The dashboard has no login of its own.
  auth:
    enabled: true
    middleware: authelia@file

podAnnotations: {}

nodeSelector: {}

tolerations:
  - operator: Exists
