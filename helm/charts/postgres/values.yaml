namespace: hlab-database

name: postgres

image:
  repository: postgres
  tag: 17.11-alpine3.24
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext: {}

podSecurityContext: {}

probes:
  startup:
    exec:
      command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    exec:
      command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    exec:
      command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

service:
  port: 5432
  containerPort: 5432

storage:
  size: 2Gi
  storageClassName: homelab-pvc-storage

# Created or updated by a Job on every install and upgrade; passwords come from the Secrets.
roles:
  admin:
    name: homelab-admin
    options: [LOGIN, CREATEDB, CREATEROLE]
    passwordSecret:
      name: postgres-admin
      key: PASSWORD

databases: {}

defaultEnv:
  PGDATA: /var/lib/postgresql/data/pgdata

env: {} # Override defaultEnv or add additional environment variables as needed

defaultSecrets:
  # Also read by PgBouncer.
  credentials:
    name: postgres-credentials
    env:
      POSTGRES_DB: POSTGRES_DB
      POSTGRES_USER: POSTGRES_USER
      POSTGRES_PASSWORD: POSTGRES_PASSWORD

secrets: {} # Override defaultSecrets or add additional secrets as needed
