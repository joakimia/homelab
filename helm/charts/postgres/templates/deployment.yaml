{{- $namespace := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- if ne (int .Values.replicaCount) 1 -}}
  {{- fail "replicaCount must be 1 until PostgreSQL replication is configured" -}}
{{- end -}}
{{- $image := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" $image.repository -}}
{{- $_ := required "image.tag is required" $image.tag -}}
{{- $database := required "database settings are required" .Values.database -}}
{{- $_ := required "database.existingSecret is required" $database.existingSecret -}}
{{- $_ := required "database.passwordSecretKey is required" $database.passwordSecretKey -}}
{{- $_ := required "database.usernameSecretKey is required" $database.usernameSecretKey -}}
{{- $_ := required "database.databaseSecretKey is required" $database.databaseSecretKey -}}
{{- $storage := required "storage settings are required" .Values.storage -}}
{{- $_ := required "storage.size is required" $storage.size -}}
{{- $_ := required "service.port is required" .Values.service.port -}}
{{- $_ := required "resources are required" .Values.resources -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgres
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.databaseSecretKey }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameSecretKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordSecretKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
