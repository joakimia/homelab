apiVersion: v2
name: grafana-tempo
description: Grafana Tempo (upstream grafana-community chart as a pinned dependency), trace storage for the homelab in single binary mode.

type: application

version: 0.1.0

appVersion: 3.1.0

# The upstream chart is pulled from its OCI registry by scripts/install.sh (helm dependency build,
# pinned by Chart.lock). The grafana/tempo chart is deprecated; it moved to grafana-community.
dependencies:
  - name: tempo
    version: 3.2.0
    repository: oci://ghcr.io/grafana-community/helm-charts
