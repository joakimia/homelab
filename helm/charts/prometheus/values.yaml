host: prometheus.homelab.com

ingress:
  className: traefik
  # Certificate for host from cert-manager (needs the cert-manager and cert-issuers charts).
  tls:
    enabled: true
    clusterIssuer: homelab-ca
  # Login through Authelia (Traefik ForwardAuth); the route is then HTTPS only. Without it, the
  # UI is open to everyone who can reach Traefik: prometheus has no login of its own.
  auth:
    enabled: false
    middleware: authelia@file
  # The server Service (prometheus.fullnameOverride + "-server").
  backend:
    service: prometheus-server
    port: 80

# Upstream chart values go under the dependency name.
prometheus:
  # Server Service: prometheus-server, port 80 (Grafana and Alloy use it).
  fullnameOverride: prometheus
  server:
    # A StatefulSet keeps its data claim when the release is uninstalled.
    statefulSet:
      enabled: true
    # Alloy sends OTLP metrics to /api/v1/otlp.
    extraFlags:
      - web.enable-lifecycle
      - web.enable-otlp-receiver
    # Short retention for a small node; whichever limit is hit first applies.
    retention: 3d
    retentionSize: 3GB
    persistentVolume:
      size: 4Gi
      storageClass: homelab-pvc-storage
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
  configmapReload:
    prometheus:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # Node disk, filesystem, memory, and network. It needs hostNetwork, hostPID, and hostPath, so it
  # runs in the privileged hlab-observability-agents namespace, not the baseline hlab-observability.
  prometheus-node-exporter:
    enabled: true
    namespaceOverride: hlab-observability-agents
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi
  # No alert receivers or push jobs yet.
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
