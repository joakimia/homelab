apiVersion: v2
name: prometheus
description: Prometheus server (upstream prometheus-community chart as a pinned dependency), metrics for the homelab without the operator.

type: application

version: 0.1.0

appVersion: 3.15.0

# The upstream chart is pulled from its OCI registry by scripts/install.sh (helm dependency build,
# pinned by Chart.lock). It is the standalone server with plain scrape configs, so there are no
# CRDs to split into a second chart.
dependencies:
  - name: prometheus
    version: 29.37.0
    repository: oci://ghcr.io/prometheus-community/charts
