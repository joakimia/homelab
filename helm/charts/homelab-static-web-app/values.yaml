namespace: hlab-frontend-apps

name: ""  # required

host: ""  # required

image:
  repository: caddy
  tag: 2.11.6-alpine
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    # The caddy binary carries it as a file capability; exec fails without it.
    add: [NET_BIND_SERVICE]
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

podSecurityContext:
  fsGroup: 1000

probes:
  startup:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

service:
  port: 8080
  containerPort: 8080

ingress:
  className: traefik
  # Certificate for host from cert-manager (needs the cert-manager and cert-issuers charts).
  tls:
    enabled: true
    clusterIssuer: homelab-ca
  # Login through Authelia (Traefik ForwardAuth); the route is then HTTPS only.
  auth:
    enabled: false
    middleware: authelia@file
  # Also answer requests without a matching host (http://<node-ip>:8080/). One app per cluster.
  catchAll: false

# Served from /usr/share/caddy. Either an existing ConfigMap (one key per file; a parent chart
# can fill it from its own files), or files here: file name -> content, flat names only.
filesConfigMap: ""
files:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>Static web app</title></head>
    <body><p>Set files in the values.</p></body>
    </html>

defaultEnv: {}

env: {} # Override defaultEnv or add additional environment variables as needed

defaultSecrets: {}

secrets: {} # Override defaultSecrets or add additional secrets as needed
