{{- $_ := required "name is required" .Values.name -}}
{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "database settings are required" .Values.database -}}
{{- $_ := required "database.host is required" .Values.database.host -}}
{{- $_ := required "database.port is required" .Values.database.port -}}
{{- $_ := required "database.existingSecret is required" .Values.database.existingSecret -}}
{{- $_ := required "database.usernameSecretKey is required" .Values.database.usernameSecretKey -}}
{{- $_ := required "database.passwordSecretKey is required" .Values.database.passwordSecretKey -}}
{{- $_ := required "database.databaseSecretKey is required" .Values.database.databaseSecretKey -}}
{{- $_ := required "pool settings are required" .Values.pool -}}
{{- $_ := required "pool.mode is required" .Values.pool.mode -}}
{{- $_ := required "pool.defaultPoolSize is required" .Values.pool.defaultPoolSize -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.name }}
              containerPort: 5432
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameSecretKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordSecretKey }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.databaseSecretKey }}
            - name: AUTH_TYPE
              value: plain
            - name: POOL_MODE
              value: {{ .Values.pool.mode | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pool.defaultPoolSize | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.name }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.name }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
