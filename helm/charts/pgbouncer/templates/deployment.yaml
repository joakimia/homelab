{{- $namespace := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $image := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" $image.repository -}}
{{- $_ := required "image.tag is required" $image.tag -}}
{{- $database := required "database settings are required" .Values.database -}}
{{- $_ := required "database.host is required" $database.host -}}
{{- $_ := required "database.port is required" $database.port -}}
{{- $_ := required "database.existingSecret is required" $database.existingSecret -}}
{{- $_ := required "database.usernameSecretKey is required" $database.usernameSecretKey -}}
{{- $_ := required "database.passwordSecretKey is required" $database.passwordSecretKey -}}
{{- $_ := required "database.databaseSecretKey is required" $database.databaseSecretKey -}}
{{- $_ := required "service.port is required" .Values.service.port -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: pgbouncer
              containerPort: 5432
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameSecretKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordSecretKey }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.databaseSecretKey }}
            - name: AUTH_TYPE
              value: plain
            - name: POOL_MODE
              value: {{ .Values.pool.mode | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pool.defaultPoolSize | quote }}
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: pgbouncer
      port: {{ .Values.service.port }}
      targetPort: pgbouncer
      protocol: TCP
