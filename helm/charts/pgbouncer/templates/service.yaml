{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "service.port is required" .Values.service.port -}}
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: pgbouncer
      port: {{ .Values.service.port }}
      targetPort: pgbouncer
      protocol: TCP
