namespace: hlab-database

name: pgbouncer

image:
  repository: edoburu/pgbouncer
  tag: v1.26.0-p0
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  startup:
    tcpSocket:
      port: 5432
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    tcpSocket:
      port: 5432
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    tcpSocket:
      port: 5432
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

service:
  port: 6432
  containerPort: 5432

defaultEnv:
  DB_HOST: postgres
  DB_PORT: 5432
  LISTEN_PORT: "{{ .Values.service.containerPort }}"
  AUTH_TYPE: plain
  POOL_MODE: transaction
  DEFAULT_POOL_SIZE: 10

env: {} # Override defaultEnv or add additional environment variables as needed

defaultSecrets:
  # Owned by the postgres chart.
  database:
    name: postgres-credentials
    env:
      DB_NAME: POSTGRES_DB
      DB_USER: POSTGRES_USER
      DB_PASSWORD: POSTGRES_PASSWORD

secrets: {} # Override defaultSecrets or add additional secrets as needed
