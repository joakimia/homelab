{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "service.port is required" .Values.service.port -}}
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
