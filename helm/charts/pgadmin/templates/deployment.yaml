{{- $namespace := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $image := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" $image.repository -}}
{{- $_ := required "image.tag is required" $image.tag -}}
{{- $_ := required "host is required" .Values.host -}}
{{- $_ := required "existingSecret is required" .Values.existingSecret -}}
{{- $_ := required "emailSecretKey is required" .Values.emailSecretKey -}}
{{- $_ := required "passwordSecretKey is required" .Values.passwordSecretKey -}}
{{- $_ := required "service.port is required" .Values.service.port -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.emailSecretKey }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.passwordSecretKey }}
            - name: PGADMIN_LISTEN_PORT
              value: "80"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: {{ .Values.service.port }}
