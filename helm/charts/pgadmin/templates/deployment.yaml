{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "existingSecret is required" .Values.existingSecret -}}
{{- $_ := required "emailSecretKey is required" .Values.emailSecretKey -}}
{{- $_ := required "passwordSecretKey is required" .Values.passwordSecretKey -}}
{{- $_ := required "service.containerPort is required" .Values.service.containerPort -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: pgadmin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.emailSecretKey }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.passwordSecretKey }}
            - name: PGADMIN_LISTEN_PORT
              value: {{ .Values.service.containerPort | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
