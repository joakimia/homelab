namespace: hlab-frontend-apps

name: pgadmin

image:
  repository: dpage/pgadmin4
  tag: 9.17
  pullPolicy: IfNotPresent

host: pgadmin.homelab.com

existingSecret: pgadmin-credentials
emailSecretKey: PGADMIN_DEFAULT_EMAIL
passwordSecretKey: PGADMIN_DEFAULT_PASSWORD

service:
  port: 5050
  containerPort: 5050

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

ingressClass:
  name: traefik
