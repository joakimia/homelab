# Upstream chart values go under the dependency name.
loki:
  # Service and pod names: loki (Grafana and Alloy use http://loki:3100).
  fullnameOverride: loki
  # One pod with every Loki component, data on its PVC.
  deploymentMode: Monolithic
  loki:
    # One tenant, no X-Scope-OrgID header needed.
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Short retention for a small node; the compactor deletes older chunks.
    limits_config:
      retention_period: 72h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
  singleBinary:
    replicas: 1
    persistence:
      size: 5Gi
      storageClass: homelab-pvc-storage
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # The scalable targets stay off in monolithic mode.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Not needed for one small instance: nginx gateway, memcached caches, canary, Helm test,
  # and the rules sidecar.
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  sidecar:
    rules:
      enabled: false
