namespace: hlab-frontend-apps

name: homepage

host: homepage.homelab.com

image:
  repository: caddy
  tag: 2.11.6-alpine
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    # The caddy binary carries it as a file capability; exec fails without it.
    add: [NET_BIND_SERVICE]
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

podSecurityContext:
  fsGroup: 1000

probes:
  startup:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

service:
  port: 8080
  containerPort: 8080

ingress:
  className: traefik
  # Certificate for host from cert-manager (needs the cert-manager and cert-issuers charts).
  tls:
    enabled: true
    clusterIssuer: homelab-ca
  # Login through Authelia (Traefik ForwardAuth); the route is then HTTPS only.
  auth:
    enabled: false
    middleware: authelia@file

content: |
  <!doctype html>
  <html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homelab</title>
  </head>
  <body>
    <h1>Homelab</h1>
    <p>Welcome. This page is served from Kubernetes through Traefik.</p>
    <ul><li><a href="https://pgadmin.homelab.com:8443/">pgAdmin</a></li></ul>
    <ul><li><a href="https://auth.homelab.com:8443/">Auth provider (local IdP)</a></li></ul>
    <ul><li><a href="https://longhorn-ui.homelab.com:8443/">Traefik</a></li></ul>
    <ul><li><a href="https://prometheus.homelab.com:8443/">Prometheus</a></li></ul>
    <ul><li><a href="https://grafana.homelab.com:8443/">Grafana</a></li></ul>
    <ul><li><a href="https://k8s-monitoring.homelab.com:8443/">k8s Monitoring</a></li></ul>
  </body>
  </html>

defaultEnv: {}

env: {} # Override defaultEnv or add additional environment variables as needed

defaultSecrets: {}

secrets: {} # Override defaultSecrets or add additional secrets as needed
