{{- $namespace := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $image := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" $image.repository -}}
{{- $_ := required "image.tag is required" $image.tag -}}
{{- $service := required "service settings are required" .Values.service -}}
{{- $_ := required "service.port is required" $service.port -}}
{{- $_ := required "service.containerPort is required" $service.containerPort -}}
{{- $_ := required "host is required" .Values.host -}}
{{- $_ := required "content is required" .Values.content -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-content
  namespace: {{ .Values.namespace }}
data:
  Caddyfile: |
    :{{ .Values.service.containerPort }} {
      root * /usr/share/caddy
      file_server
    }
  index.html: |
    {{- .Values.content | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: content
              mountPath: /usr/share/caddy/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: homepage-content
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: {{ .Values.service.port }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: {{ .Values.service.port }}
