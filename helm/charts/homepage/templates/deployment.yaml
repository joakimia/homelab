{{- $_ := required "name is required" .Values.name -}}
{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "replicaCount is required" .Values.replicaCount -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "service settings are required" .Values.service -}}
{{- $_ := required "service.containerPort is required" .Values.service.containerPort -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # Not for the port (8080 is unprivileged): the caddy image sets this as a file
              # capability on /usr/bin/caddy, and exec fails ("operation not permitted") when
              # it is missing from the container's capability set.
              add: [NET_BIND_SERVICE]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: content
              mountPath: /usr/share/caddy/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: homepage-content
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
      securityContext:
        fsGroup: 1000
