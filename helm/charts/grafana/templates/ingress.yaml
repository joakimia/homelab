{{- $_ := required "host is required" .Values.host -}}
{{- $_ := required "ingress settings are required" .Values.ingress -}}
{{- $_ := required "ingress.className is required" .Values.ingress.className -}}
{{- $_ := required "ingress.tls settings are required" .Values.ingress.tls -}}
{{- if .Values.ingress.tls.enabled }}
{{- $_ := required "ingress.tls.clusterIssuer is required when ingress.tls.enabled is true" .Values.ingress.tls.clusterIssuer -}}
{{- end }}
{{- $_ := required "ingress.auth settings are required" .Values.ingress.auth -}}
{{- if .Values.ingress.auth.enabled }}
{{- $_ := required "ingress.auth.middleware is required when ingress.auth.enabled is true" .Values.ingress.auth.middleware -}}
{{- if not .Values.ingress.tls.enabled }}
{{- fail "ingress.auth.enabled needs ingress.tls.enabled: the login cookie only works over HTTPS" -}}
{{- end }}
{{- end }}
{{- $_ := required "grafana settings are required" .Values.grafana -}}
{{- $_ := required "grafana.fullnameOverride is required" .Values.grafana.fullnameOverride -}}
{{- $_ := required "grafana.service.port is required" .Values.grafana.service.port -}}
{{- $ini := required "grafana.grafana.ini is required" (index .Values.grafana "grafana.ini") -}}
{{- $server := required "grafana.grafana.ini.server is required" $ini.server -}}
{{- if ne .Values.host (toString $server.domain) }}
{{- fail "host must equal grafana.grafana.ini.server.domain" -}}
{{- end }}
{{- $proxy := index $ini "auth.proxy" | default dict -}}
{{- if $proxy.enabled }}
{{- if not .Values.ingress.auth.enabled }}
{{- fail "grafana.ini auth.proxy needs ingress.auth.enabled: without Authelia in front, anyone could send Remote-User" -}}
{{- end }}
{{- $_ := required "grafana.grafana.ini.auth.proxy.whitelist is required when auth.proxy is enabled (the pod network Traefik connects from)" $proxy.whitelist -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.grafana.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
  {{- if or .Values.ingress.tls.enabled .Values.ingress.auth.enabled }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.auth.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.auth.middleware }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.grafana.fullnameOverride }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.grafana.fullnameOverride }}
                port:
                  number: {{ .Values.grafana.service.port }}
