<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab</title>
</head>

<body>
  <h1>Homelab</h1>
  <p>Welcome. This page is served from Kubernetes through Traefik.</p>
  <ul>
    {{- range $id, $link := (index .Values "homelab-frontend").links }}
    {{- if $link.enabled }}
    <li><a href="{{ $link.url }}">{{ $link.title }}</a></li>
    {{- end }}
    {{- end }}
  </ul>
</body>

</html>
