# Upstream chart values go under the dependency name.
cert-manager:
  crds:
    enabled: true
    # Keep CRDs (and so all Certificates) on uninstall.
    keep: true
  # No Prometheus in the cluster yet.
  prometheus:
    enabled: false
  # DNS-01 (Let's Encrypt): check that the TXT record is visible on public resolvers, not
  # through cluster DNS, which can cache "no such record" for the zone's negative TTL (30 min
  # on Cloudflare) and stall issuing.
  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  startupapicheck:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
