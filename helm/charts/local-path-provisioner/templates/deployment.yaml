{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "image settings are required" .Values.image -}}
{{- $_ := required "image.repository is required" .Values.image.repository -}}
{{- $_ := required "image.tag is required" .Values.image.tag -}}
{{- $_ := required "image.pullPolicy is required" .Values.image.pullPolicy -}}
{{- $_ := required "provisionerName is required" .Values.provisionerName -}}
{{- $_ := required "ports settings are required" .Values.ports -}}
{{- $_ := required "ports.health.containerPort is required" .Values.ports.health.containerPort -}}
{{- $_ := required "probes settings are required" .Values.probes -}}
{{- $_ := required "probes.startup settings are required" .Values.probes.startup -}}
{{- $_ := required "probes.startup.initialDelaySeconds is required" .Values.probes.startup.initialDelaySeconds -}}
{{- $_ := required "probes.startup.periodSeconds is required" .Values.probes.startup.periodSeconds -}}
{{- $_ := required "probes.startup.timeoutSeconds is required" .Values.probes.startup.timeoutSeconds -}}
{{- $_ := required "probes.startup.failureThreshold is required" .Values.probes.startup.failureThreshold -}}
{{- $_ := required "probes.readiness settings are required" .Values.probes.readiness -}}
{{- $_ := required "probes.readiness.initialDelaySeconds is required" .Values.probes.readiness.initialDelaySeconds -}}
{{- $_ := required "probes.readiness.periodSeconds is required" .Values.probes.readiness.periodSeconds -}}
{{- $_ := required "probes.readiness.timeoutSeconds is required" .Values.probes.readiness.timeoutSeconds -}}
{{- $_ := required "probes.readiness.failureThreshold is required" .Values.probes.readiness.failureThreshold -}}
{{- $_ := required "probes.liveness settings are required" .Values.probes.liveness -}}
{{- $_ := required "probes.liveness.initialDelaySeconds is required" .Values.probes.liveness.initialDelaySeconds -}}
{{- $_ := required "probes.liveness.periodSeconds is required" .Values.probes.liveness.periodSeconds -}}
{{- $_ := required "probes.liveness.timeoutSeconds is required" .Values.probes.liveness.timeoutSeconds -}}
{{- $_ := required "probes.liveness.failureThreshold is required" .Values.probes.liveness.failureThreshold -}}
{{- $_ := required "resources are required" .Values.resources -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-path-provisioner.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "local-path-provisioner.labels" . | nindent 4 }}
spec:
  # One replica: the provisioner does not run leader election.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "local-path-provisioner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "local-path-provisioner.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "local-path-provisioner.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: local-path-provisioner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - local-path-provisioner
            - start
            - --config=/etc/config/config.json
            - --provisioner-name={{ .Values.provisionerName }}
            - --configmap-name={{ include "local-path-provisioner.fullname" . }}-config
            - --service-account-name={{ include "local-path-provisioner.fullname" . }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: {{ .Values.ports.health.containerPort | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.ports.health.containerPort }}
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config/
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "local-path-provisioner.fullname" . }}-config
