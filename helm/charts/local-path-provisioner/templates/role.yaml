{{- $_ := required "namespace is required" .Values.namespace -}}
# The provisioner starts helper pods in its own namespace to create and remove volume folders.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "local-path-provisioner.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "local-path-provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
