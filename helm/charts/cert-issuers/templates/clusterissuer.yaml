{{- $_ := required "clusterIssuer settings are required" .Values.clusterIssuer -}}
{{- $_ := required "clusterIssuer.name is required" .Values.clusterIssuer.name -}}
{{- $_ := required "namespace is required" .Values.namespace -}}
{{- $_ := required "acme settings are required" .Values.acme -}}
{{- $_ := required "defaultSecrets settings are required" .Values.defaultSecrets -}}
{{- $_ := required "defaultSecrets.ca settings are required" .Values.defaultSecrets.ca -}}
{{- $_ := required "defaultSecrets.ca.name is required" .Values.defaultSecrets.ca.name -}}
{{- $_ := required "defaultSecrets.ca.keys settings are required" .Values.defaultSecrets.ca.keys -}}
{{- $_ := required "defaultSecrets.ca.keys.certificate is required" .Values.defaultSecrets.ca.keys.certificate -}}
{{- $_ := required "defaultSecrets.ca.keys.privateKey is required" .Values.defaultSecrets.ca.keys.privateKey -}}
{{- if .Values.acme.enabled -}}
{{- $_ := required "acme.issuers is required when acme.enabled is true" .Values.acme.issuers -}}
{{- $_ := required "defaultSecrets.cloudflare settings are required when acme.enabled is true" .Values.defaultSecrets.cloudflare -}}
{{- $_ := required "defaultSecrets.cloudflare.name is required" .Values.defaultSecrets.cloudflare.name -}}
{{- $_ := required "defaultSecrets.cloudflare.keys settings are required" .Values.defaultSecrets.cloudflare.keys -}}
{{- $_ := required "defaultSecrets.cloudflare.keys.apiToken is required" .Values.defaultSecrets.cloudflare.keys.apiToken -}}
{{- end -}}
{{- $secrets := mergeOverwrite (deepCopy .Values.defaultSecrets) (deepCopy (.Values.secrets | default dict)) -}}
{{- $ca := $secrets.ca -}}
{{- $cloudflare := $secrets.cloudflare -}}
{{- /* Only when installing (lookup is empty in helm template and lint): the Secrets and their keys must exist. */ -}}
{{- if lookup "v1" "Namespace" "" "kube-system" -}}
{{- $needed := list $ca -}}
{{- if .Values.acme.enabled -}}
{{- $needed = append $needed $cloudflare -}}
{{- end -}}
{{- range $wanted := $needed -}}
{{- $secret := lookup "v1" "Secret" $.Values.namespace $wanted.name -}}
{{- if not $secret -}}
{{- fail (printf "Secret %s/%s is missing; scripts/install.sh creates it" $.Values.namespace $wanted.name) -}}
{{- end -}}
{{- range $key := values $wanted.keys -}}
{{- if not (hasKey ($secret.data | default dict) $key) -}}
{{- fail (printf "Secret %s/%s has no key %s" $secret.metadata.namespace $secret.metadata.name $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  ca:
    secretName: {{ $ca.name }}
{{- if .Values.acme.enabled }}
{{- range $name, $server := .Values.acme.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    # Account key, created by cert-manager on first use.
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $cloudflare.name }}
              key: {{ $cloudflare.keys.apiToken }}
{{- end }}
{{- end }}
