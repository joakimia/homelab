namespace: hlab-platform

name: cert-issuers

# Used by Ingresses as cert-manager.io/cluster-issuer: <name>.
clusterIssuer:
  name: homelab-ca

# Let's Encrypt issuers that prove domain ownership with a Cloudflare DNS record (DNS-01), so
# they also work for hosts that are not reachable from the internet. Off by default; a profile
# turns them on when its hosts are in a Cloudflare zone.
acme:
  enabled: false
  # ClusterIssuer name: ACME directory. Test with the staging issuer (untrusted certificates,
  # high rate limits) before the real one.
  issuers:
    letsencrypt: https://acme-v02.api.letsencrypt.org/directory
    letsencrypt-staging: https://acme-staging-v02.api.letsencrypt.org/directory

defaultEnv: {}

env: {} # Override defaultEnv or add additional environment variables as needed

defaultSecrets:
  # TLS Secret from the local CA, created by scripts/install.sh.
  ca:
    name: homelab-ca
    keys:
      certificate: tls.crt
      privateKey: tls.key
  # Cloudflare API token for DNS-01 (only with acme.enabled), created by scripts/install.sh.
  cloudflare:
    name: cloudflare-api-token
    keys:
      apiToken: api-token

secrets: {} # Override defaultSecrets or add additional secrets as needed
