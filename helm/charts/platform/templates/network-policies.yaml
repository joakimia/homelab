{{- include "platform.validateValues" . -}}
{{- if .Values.networkPolicies.enabled }}
{{- $networking := .Values.namespaces.networking }}
{{- $frontend := .Values.namespaces.frontend }}
{{- $database := .Values.namespaces.database }}
{{- $dnsNamespace := .Values.networkPolicies.dns.namespace }}
{{- $dnsSelector := .Values.networkPolicies.dns.podSelector }}
{{- $traefikSelector := .Values.networkPolicies.traefik.podSelector }}
{{- $pgadminSelector := .Values.networkPolicies.pgadmin.podSelector }}
{{- $pgbouncerSelector := .Values.networkPolicies.pgbouncer.podSelector }}
{{- $postgresSelector := .Values.networkPolicies.postgres.podSelector }}
{{- if $networking.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $networking.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-traffic-to-traefik
  namespace: {{ $networking.name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $traefikSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.networkPolicies.traefik.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
---
{{- end }}
{{- if $frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $frontend.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $frontend.name }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $dnsSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- if $networking.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-frontend-apps
  namespace: {{ $frontend.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $networking.name }}
          podSelector:
            matchLabels:
              {{- toYaml $traefikSelector | nindent 14 }}
---
{{- end }}
{{- end }}
{{- if and $frontend.enabled $database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgadmin-egress-to-pgbouncer
  namespace: {{ $frontend.name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $pgadminSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $database.name }}
          podSelector:
            matchLabels:
              {{- toYaml $pgbouncerSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6432
---
{{- end }}
{{- if $database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $database.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $database.name }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $dnsSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgadmin-to-pgbouncer
  namespace: {{ $database.name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $pgbouncerSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $frontend.name }}
          podSelector:
            matchLabels:
              {{- toYaml $pgadminSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-to-postgres
  namespace: {{ $database.name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $postgresSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $pgbouncerSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-egress-to-postgres
  namespace: {{ $database.name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $pgbouncerSelector | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $postgresSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
