{{- $_ := required "host is required" .Values.host -}}
{{- $_ := required "ingress settings are required" .Values.ingress -}}
{{- $_ := required "ingress.className is required" .Values.ingress.className -}}
{{- $_ := required "ingress.tls settings are required" .Values.ingress.tls -}}
{{- if .Values.ingress.tls.enabled }}
{{- $_ := required "ingress.tls.clusterIssuer is required when ingress.tls.enabled is true" .Values.ingress.tls.clusterIssuer -}}
{{- end }}
{{- $_ := required "ingress.backend settings are required" .Values.ingress.backend -}}
{{- $_ := required "ingress.backend.service is required" .Values.ingress.backend.service -}}
{{- $_ := required "ingress.backend.port is required" .Values.ingress.backend.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.backend.service }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-server
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.ingress.backend.service }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.backend.service }}
                port:
                  number: {{ .Values.ingress.backend.port }}
