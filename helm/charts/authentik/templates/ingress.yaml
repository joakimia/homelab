{{- $_ := required "host is required" .Values.host -}}
{{- $_ := required "ingress settings are required" .Values.ingress -}}
{{- $_ := required "ingress.className is required" .Values.ingress.className -}}
{{- $_ := required "ingress.tls settings are required" .Values.ingress.tls -}}
{{- if .Values.ingress.tls.enabled }}
{{- $_ := required "ingress.tls.clusterIssuer is required when ingress.tls.enabled is true" .Values.ingress.tls.clusterIssuer -}}
{{- end }}
{{- $_ := required "authentik settings are required" .Values.authentik -}}
{{- $_ := required "authentik.fullnameOverride is required" .Values.authentik.fullnameOverride -}}
{{- $_ := required "authentik.server.service.servicePortHttp is required" .Values.authentik.server.service.servicePortHttp -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.authentik.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.authentik.fullnameOverride }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.authentik.fullnameOverride }}-server
                port:
                  number: {{ .Values.authentik.server.service.servicePortHttp }}
