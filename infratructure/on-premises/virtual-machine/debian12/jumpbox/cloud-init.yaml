#cloud-config
# Jumpbox: the entry point to the cluster network. It is not a Kubernetes node. It holds the
# tools and repository bundle to provision and deploy to the nodes, and hosts a local registry.
package_update: true
package_upgrade: true

# install.sh adds ssh_authorized_keys with this machine's SSH public key.
users:
  - name: debian
    lock_passwd: false

ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - jq
  - git
  - openssh-client
  - xorriso          # install.sh --iso on the jumpbox
  - skopeo           # copy images into the local registry without a container runtime
  - docker-registry  # CNCF distribution registry from Debian 12, systemd service on :5000
  - unattended-upgrades

runcmd:
  # Step 1: Install kubectl, Helm, and k9s
  # Pinned versions: exact releases checked against the SHA-256 recorded here. kubectl matches
  # the clusters' 1.36 minor. To upgrade, change the version and both checksums.
  - |
    set -e
    # Set versions and architecture-specific checksums
    kubectl_version=v1.36.5
    helm_version=v4.3.0
    k9s_version=v0.51.0
    arch=$(dpkg --print-architecture)
    case "$arch" in
      amd64)
        kubectl_sha256=33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e
        helm_sha256=86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        k9s_sha256=c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7 ;;
      arm64)
        kubectl_sha256=88fc1aca8fd0c1b44fe379f67c39bd6858bdfc50241dc55775f84d0f5b31da3a
        helm_sha256=31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
        k9s_sha256=3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c ;;
      *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
    esac

    # Download and verify the binaries
    tmp=$(mktemp -d)
    curl -fsSL --retry 3 -o "$tmp/kubectl" "https://dl.k8s.io/release/$kubectl_version/bin/linux/$arch/kubectl"
    curl -fsSL --retry 3 -o "$tmp/helm.tar.gz" "https://get.helm.sh/helm-$helm_version-linux-$arch.tar.gz"
    curl -fsSL --retry 3 -o "$tmp/k9s.tar.gz" "https://github.com/derailed/k9s/releases/download/$k9s_version/k9s_Linux_$arch.tar.gz"
    printf '%s  %s\n' "$kubectl_sha256" "$tmp/kubectl" "$helm_sha256" "$tmp/helm.tar.gz" "$k9s_sha256" "$tmp/k9s.tar.gz" | sha256sum --check
    tar -xzf "$tmp/helm.tar.gz" -C "$tmp" "linux-$arch/helm"
    tar -xzf "$tmp/k9s.tar.gz" -C "$tmp" k9s

    # Install the binaries
    install -m 0755 "$tmp/kubectl" /usr/local/bin/kubectl
    install -m 0755 "$tmp/linux-$arch/helm" /usr/local/bin/helm
    install -m 0755 "$tmp/k9s" /usr/local/bin/k9s

    # Clean up temporary files
    rm -rf "$tmp"


  # Step 2: Create the jumpbox's SSH key
  # The jumpbox's own key. Nodes provisioned from the jumpbox with install.sh authorize it.
  - [runuser, -u, debian, --, sh, -c, 'test -f ~/.ssh/id_ed25519 || ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519 -C "debian@$(hostname)"']


  # Step 3: Configure and start the local registry
  # Local registry, HTTP only on port 5000, images in /var/lib/docker-registry. Written after the
  # package install so it replaces the package's default config.
  - |
    set -e
    cat > /etc/docker/registry/config.yml <<'CONFIG'
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/docker-registry
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
    CONFIG
    systemctl enable docker-registry
    systemctl restart docker-registry
    timeout 60 sh -c 'until curl -fsS http://localhost:5000/v2/ >/dev/null; do sleep 2; done'


  # Step 4: Basic hardening (work in progress: SSH and security updates only)
  - |
    set -e
    # SSH: no root login, few attempts per connection, no X11 forwarding. Files in
    # sshd_config.d are read in name order and the first value wins, so 10- beats cloud-init's 50-.
    cat > /etc/ssh/sshd_config.d/10-homelab-hardening.conf <<'CONFIG'
    PermitRootLogin no
    MaxAuthTries 3
    X11Forwarding no
    CONFIG
    # Key-only logins, but only when install.sh authorized a key; otherwise SSH would lock out.
    if [ -s /home/debian/.ssh/authorized_keys ]; then
      printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\n' >> /etc/ssh/sshd_config.d/10-homelab-hardening.conf
    else
      echo "No SSH key authorized for debian; password logins stay on." >&2
    fi
    sshd -t
    systemctl reload ssh
    # Daily Debian security updates only, and never an automatic reboot.
    cat > /etc/apt/apt.conf.d/52homelab-unattended-upgrades <<'CONFIG'
    #clear Unattended-Upgrade::Origins-Pattern;
    Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"; };
    Unattended-Upgrade::Automatic-Reboot "false";
    CONFIG
    printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' > /etc/apt/apt.conf.d/20auto-upgrades


  # Step 5: Print the effective hardening settings to /var/log/cloud-init-output.log
  - [sh, -c, 'sshd -T | grep -E "^(permitrootlogin|maxauthtries|x11forwarding|passwordauthentication|kbdinteractiveauthentication) "']
  - [sh, -c, 'apt-config dump | grep -E "^(APT::Periodic::Unattended-Upgrade|Unattended-Upgrade::Automatic-Reboot|Unattended-Upgrade::Origins-Pattern::) "']
