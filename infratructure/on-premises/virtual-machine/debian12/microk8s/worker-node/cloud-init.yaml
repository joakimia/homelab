#cloud-config
package_update: true
package_upgrade: true

# install.sh adds ssh_authorized_keys with this machine's SSH public key.
users:
  - name: debian
    lock_passwd: false

ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - jq
  - snapd
  - unattended-upgrades
  # Longhorn: iSCSI for its block devices, NFS for ReadWriteMany volumes.
  - open-iscsi
  - nfs-common

write_files:
  # Longhorn attaches volumes over iSCSI; load the module at every boot.
  - path: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp

runcmd:
  # Step 1: Enable snapd and wait until it can install snaps
  - [systemctl, enable, --now, snapd.socket]
  - [sh, -c, 'ln -sfn /var/lib/snapd/snap /snap']
  - [snap, wait, system, seed.loaded]


  # Step 2: Longhorn prerequisites: load iscsi_tcp now (modules-load.d covers reboots) and run
  # the iSCSI daemon.
  - [modprobe, iscsi_tcp]
  - [systemctl, enable, --now, iscsid]


  # Step 3: Install MicroK8s
  # Pinned to the control plane's minor-version snap track (patch updates through snap refresh).
  # A worker has no API server or kubeconfig of its own: use kubectl, Helm, and k9s on the
  # control plane or the Mac. install.sh --join joins it to a cluster.
  - [snap, install, microk8s, --classic, --channel=1.36/stable]


  # Step 4: Wait for MicroK8s and give the debian user access
  - [usermod, -aG, microk8s, debian]
  - [/snap/bin/microk8s, status, --wait-ready]


  # Step 5: Basic hardening (work in progress: SSH and security updates only)
  - |
    set -e
    # SSH: no root login, few attempts per connection, no X11 forwarding. Files in
    # sshd_config.d are read in name order and the first value wins, so 10- beats cloud-init's 50-.
    cat > /etc/ssh/sshd_config.d/10-homelab-hardening.conf <<'CONFIG'
    PermitRootLogin no
    MaxAuthTries 3
    X11Forwarding no
    CONFIG
    # Key-only logins, but only when install.sh authorized a key; otherwise SSH would lock out.
    if [ -s /home/debian/.ssh/authorized_keys ]; then
      printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\n' >> /etc/ssh/sshd_config.d/10-homelab-hardening.conf
    else
      echo "No SSH key authorized for debian; password logins stay on." >&2
    fi
    sshd -t
    systemctl reload ssh
    # Daily Debian security updates only, and never an automatic reboot.
    cat > /etc/apt/apt.conf.d/52homelab-unattended-upgrades <<'CONFIG'
    #clear Unattended-Upgrade::Origins-Pattern;
    Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"; };
    Unattended-Upgrade::Automatic-Reboot "false";
    CONFIG
    printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' > /etc/apt/apt.conf.d/20auto-upgrades


  # Step 6: Print the effective hardening settings to /var/log/cloud-init-output.log
  - [sh, -c, 'sshd -T | grep -E "^(permitrootlogin|maxauthtries|x11forwarding|passwordauthentication|kbdinteractiveauthentication) "']
  - [sh, -c, 'apt-config dump | grep -E "^(APT::Periodic::Unattended-Upgrade|Unattended-Upgrade::Automatic-Reboot|Unattended-Upgrade::Origins-Pattern::) "']
