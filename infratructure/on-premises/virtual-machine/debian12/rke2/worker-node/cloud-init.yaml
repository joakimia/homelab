#cloud-config
package_update: true
package_upgrade: true

# install.sh adds ssh_authorized_keys with this machine's SSH public key.
users:
  - name: debian
    lock_passwd: false

ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - jq
  - unattended-upgrades
  # Longhorn: iSCSI for its block devices, NFS for ReadWriteMany volumes.
  - open-iscsi
  - nfs-common

# Work in progress: the agent is installed but not joined or started. Joining needs the
# server URL (https://<control-plane-ip>:9345) and the token from
# /var/lib/rancher/rke2/server/node-token on the control plane in
# /etc/rancher/rke2/config.yaml; keep the token out of Git.
write_files:
  # Longhorn attaches volumes over iSCSI; load the module at every boot.
  - path: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp
  - path: /etc/profile.d/rke2.sh
    content: |
      export PATH="$PATH:/var/lib/rancher/rke2/bin"

runcmd:
  # Step 1: Turn off swap
  # The kubelet expects swap to be off; the Debian installer usually creates a swap partition.
  - [swapoff, -a]
  - [sed, -i, '/[[:space:]]swap[[:space:]]/ s/^[^#]/#&/', /etc/fstab]


  # Step 2: Prepare the node for Longhorn
  # Load iscsi_tcp now (modules-load.d covers reboots) and run the iSCSI daemon.
  - [modprobe, iscsi_tcp]
  - [systemctl, enable, --now, iscsid]


  # Step 3: Install RKE2
  # Pinned versions. RKE2 comes from its versioned installer (checked here), which verifies the
  # release tarball itself; Helm and k9s are exact releases checked against the SHA-256 recorded
  # here. To upgrade, change the version and checksums from the release pages.
  - |
    set -e
    # Set the version and the installer checksum
    rke2_version=v1.36.5+rke2r1
    installer_sha256=42983c86d1da64a92061d83afb57630cedd69241989f1b0673f3db6c3d92ee6b

    # Download and verify the installer
    curl -fsSL --retry 3 -o /tmp/rke2-install.sh "https://raw.githubusercontent.com/rancher/rke2/v1.36.5%2Brke2r1/install.sh"
    echo "$installer_sha256  /tmp/rke2-install.sh" | sha256sum --check

    # Install RKE2
    INSTALL_RKE2_VERSION="$rke2_version" INSTALL_RKE2_TYPE=agent sh /tmp/rke2-install.sh

    # Clean up the installer
    rm -f /tmp/rke2-install.sh


  # Step 4: Install Helm and k9s
  - |
    set -e
    # Set versions and architecture-specific checksums
    helm_version=v4.3.0
    k9s_version=v0.51.0
    arch=$(dpkg --print-architecture)
    case "$arch" in
      amd64)
        helm_sha256=86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        k9s_sha256=c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7 ;;
      arm64)
        helm_sha256=31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
        k9s_sha256=3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c ;;
      *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
    esac

    # Download and verify the binaries
    tmp=$(mktemp -d)
    curl -fsSL --retry 3 -o "$tmp/helm.tar.gz" "https://get.helm.sh/helm-$helm_version-linux-$arch.tar.gz"
    curl -fsSL --retry 3 -o "$tmp/k9s.tar.gz" "https://github.com/derailed/k9s/releases/download/$k9s_version/k9s_Linux_$arch.tar.gz"
    printf '%s  %s\n' "$helm_sha256" "$tmp/helm.tar.gz" "$k9s_sha256" "$tmp/k9s.tar.gz" | sha256sum --check
    tar -xzf "$tmp/helm.tar.gz" -C "$tmp" "linux-$arch/helm"
    tar -xzf "$tmp/k9s.tar.gz" -C "$tmp" k9s

    # Install the binaries
    install -m 0755 "$tmp/linux-$arch/helm" /usr/local/bin/helm
    install -m 0755 "$tmp/k9s" /usr/local/bin/k9s

    # Clean up temporary files
    rm -rf "$tmp"


  # Step 5: Basic hardening (work in progress: SSH and security updates only)
  - |
    set -e
    # SSH: no root login, few attempts per connection, no X11 forwarding. Files in
    # sshd_config.d are read in name order and the first value wins, so 10- beats cloud-init's 50-.
    cat > /etc/ssh/sshd_config.d/10-homelab-hardening.conf <<'CONFIG'
    PermitRootLogin no
    MaxAuthTries 3
    X11Forwarding no
    CONFIG
    # Key-only logins, but only when install.sh authorized a key; otherwise SSH would lock out.
    if [ -s /home/debian/.ssh/authorized_keys ]; then
      printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\n' >> /etc/ssh/sshd_config.d/10-homelab-hardening.conf
    else
      echo "No SSH key authorized for debian; password logins stay on." >&2
    fi
    sshd -t
    systemctl reload ssh
    # Daily Debian security updates only, and never an automatic reboot.
    cat > /etc/apt/apt.conf.d/52homelab-unattended-upgrades <<'CONFIG'
    #clear Unattended-Upgrade::Origins-Pattern;
    Unattended-Upgrade::Origins-Pattern { "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"; };
    Unattended-Upgrade::Automatic-Reboot "false";
    CONFIG
    printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' > /etc/apt/apt.conf.d/20auto-upgrades


  # Step 6: Print the effective hardening settings to /var/log/cloud-init-output.log
  - [sh, -c, 'sshd -T | grep -E "^(permitrootlogin|maxauthtries|x11forwarding|passwordauthentication|kbdinteractiveauthentication) "']
  - [sh, -c, 'apt-config dump | grep -E "^(APT::Periodic::Unattended-Upgrade|Unattended-Upgrade::Automatic-Reboot|Unattended-Upgrade::Origins-Pattern::) "']
