#cloud-config
package_update: true
package_upgrade: true

# install.sh adds ssh_authorized_keys with this machine's SSH public key.
users:
  - name: debian
    lock_passwd: false

ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - jq
  - snapd

runcmd:
  - [systemctl, enable, --now, snapd.socket]
  - [sh, -c, 'ln -sfn /var/lib/snapd/snap /snap']
  - [snap, wait, system, seed.loaded]
  # Pinned versions. MicroK8s and kubectl follow a minor-version snap track (patch updates
  # arrive through snap refresh); Helm and k9s are exact releases checked against the SHA-256
  # recorded here. To upgrade, change the version and both checksums from the release page.
  - [snap, install, microk8s, --classic, --channel=1.36/stable]
  - [snap, install, kubectl, --classic, --channel=1.36/stable]
  - |
    set -e
    helm_version=v4.3.0
    k9s_version=v0.51.0
    arch=$(dpkg --print-architecture)
    case "$arch" in
      amd64)
        helm_sha256=86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        k9s_sha256=c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7 ;;
      arm64)
        helm_sha256=31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
        k9s_sha256=3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c ;;
      *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
    esac
    tmp=$(mktemp -d)
    curl -fsSL --retry 3 -o "$tmp/helm.tar.gz" "https://get.helm.sh/helm-$helm_version-linux-$arch.tar.gz"
    curl -fsSL --retry 3 -o "$tmp/k9s.tar.gz" "https://github.com/derailed/k9s/releases/download/$k9s_version/k9s_Linux_$arch.tar.gz"
    printf '%s  %s\n' "$helm_sha256" "$tmp/helm.tar.gz" "$k9s_sha256" "$tmp/k9s.tar.gz" | sha256sum --check
    tar -xzf "$tmp/helm.tar.gz" -C "$tmp" "linux-$arch/helm"
    tar -xzf "$tmp/k9s.tar.gz" -C "$tmp" k9s
    install -m 0755 "$tmp/linux-$arch/helm" /usr/local/bin/helm
    install -m 0755 "$tmp/k9s" /usr/local/bin/k9s
    rm -rf "$tmp"
    # An older seed installed Helm as a snap; remove it so only the pinned binary is on PATH.
    if snap list helm >/dev/null 2>&1; then snap remove helm; fi
  - [usermod, -aG, microk8s, debian]
  - [/snap/bin/microk8s, status, --wait-ready]
  - [install, -d, -o, debian, -g, debian, -m, '0700', /home/debian/.kube]
  # Point the node's own kubeconfig at 127.0.0.1 so it keeps working when DHCP changes the IP.
  # deploy.sh on the Mac rewrites the server to the address it connects to.
  - [sh, -c, '/snap/bin/microk8s config | sed "s#server: https://.*:16443#server: https://127.0.0.1:16443#" > /home/debian/.kube/config']
  - [chown, 'debian:debian', /home/debian/.kube/config]
  - [chmod, '0600', /home/debian/.kube/config]
