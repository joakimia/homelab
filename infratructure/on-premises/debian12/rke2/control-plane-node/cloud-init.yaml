#cloud-config
package_update: true
package_upgrade: true

# install.sh adds ssh_authorized_keys with this machine's SSH public key.
users:
  - name: debian
    lock_passwd: false

ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - jq

write_files:
  - path: /etc/rancher/rke2/config.yaml
    permissions: '0600'
    content: |
      # The homelab Traefik chart provides ingress on host ports 8080/8443, so the ingress
      # controller bundled with RKE2 (Traefik on 80/443 since v1.36) stays off.
      ingress-controller: none
      write-kubeconfig-mode: "0600"
  - path: /etc/profile.d/rke2.sh
    content: |
      export PATH="$PATH:/var/lib/rancher/rke2/bin"

runcmd:
  # The kubelet expects swap to be off; the Debian installer usually creates a swap partition.
  - [swapoff, -a]
  - [sed, -i, '/[[:space:]]swap[[:space:]]/ s/^[^#]/#&/', /etc/fstab]
  # Pinned versions. RKE2 comes from its versioned installer (checked here), which verifies the
  # release tarball itself; Helm and k9s are exact releases checked against the SHA-256 recorded
  # here. To upgrade, change the version and checksums from the release pages.
  - |
    set -e
    rke2_version=v1.36.5+rke2r1
    installer_sha256=42983c86d1da64a92061d83afb57630cedd69241989f1b0673f3db6c3d92ee6b
    curl -fsSL --retry 3 -o /tmp/rke2-install.sh "https://raw.githubusercontent.com/rancher/rke2/v1.36.5%2Brke2r1/install.sh"
    echo "$installer_sha256  /tmp/rke2-install.sh" | sha256sum --check
    INSTALL_RKE2_VERSION="$rke2_version" INSTALL_RKE2_TYPE=server sh /tmp/rke2-install.sh
    rm -f /tmp/rke2-install.sh
  - [systemctl, enable, --now, rke2-server.service]
  - |
    set -e
    helm_version=v4.3.0
    k9s_version=v0.51.0
    arch=$(dpkg --print-architecture)
    case "$arch" in
      amd64)
        helm_sha256=86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        k9s_sha256=c3752ad51a5a4015a113819c4eeb6e55a4d0e4b8e652494797532f6fc8161dd7 ;;
      arm64)
        helm_sha256=31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
        k9s_sha256=3ee05c82e5f9198928a4e86133608ba6a2c10a2244d6a7789e820f78319d640c ;;
      *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
    esac
    tmp=$(mktemp -d)
    curl -fsSL --retry 3 -o "$tmp/helm.tar.gz" "https://get.helm.sh/helm-$helm_version-linux-$arch.tar.gz"
    curl -fsSL --retry 3 -o "$tmp/k9s.tar.gz" "https://github.com/derailed/k9s/releases/download/$k9s_version/k9s_Linux_$arch.tar.gz"
    printf '%s  %s\n' "$helm_sha256" "$tmp/helm.tar.gz" "$k9s_sha256" "$tmp/k9s.tar.gz" | sha256sum --check
    tar -xzf "$tmp/helm.tar.gz" -C "$tmp" "linux-$arch/helm"
    tar -xzf "$tmp/k9s.tar.gz" -C "$tmp" k9s
    install -m 0755 "$tmp/linux-$arch/helm" /usr/local/bin/helm
    install -m 0755 "$tmp/k9s" /usr/local/bin/k9s
    rm -rf "$tmp"
  - [ln, -sf, /var/lib/rancher/rke2/bin/kubectl, /usr/local/bin/kubectl]
  - |
    set -e
    timeout 600 sh -c 'until /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes >/dev/null 2>&1; do sleep 5; done'
  - [install, -d, -o, debian, -g, debian, -m, '0700', /home/debian/.kube]
  - [install, -o, debian, -g, debian, -m, '0600', /etc/rancher/rke2/rke2.yaml, /home/debian/.kube/config]
